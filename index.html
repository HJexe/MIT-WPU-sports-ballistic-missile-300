    <script>
      // Make window.fetch writable so third-party browser extensions or proxy interceptors
      // do not throw "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : null;
          let activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        // Suppress external browser extension injection errors
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.includes('chrome-extension://')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
